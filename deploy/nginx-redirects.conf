# ============================================================================
# TOGO GROUP PRO — eski sayt (togogrouppro.uz) uchun 301 redirect qoidalari
# ============================================================================
#
# MAQSAD: Eski Laravel saytdagi (togogrouppro.uz) barcha URL'larni yangi
# Next.js saytga (togogroup.uz) 301 (doimiy) redirect bilan yo'naltirish.
# Bu qidiruv tizimlaridagi (Google, Yandex) mavjud indekslanish va reyting
# qiymatini yangi domenga saqlab qolish uchun zarur.
#
# QANDAY O'RNATISH:
# 1. Bu fayldagi "location" bloklarini eski serverdagi togogrouppro.uz
#    uchun MAVJUD nginx server{} blokining ICHIGA joylashtiring
#    (odatda /etc/nginx/sites-available/togogrouppro.uz yoki shunga o'xshash).
#    E'TIBOR: Bu faylni alohida server{} blok sifatida QO'SHMANG — Laravel
#    ilovasi allaqachon o'z server{} blokiga ega, faqat quyidagi location
#    qoidalarini o'sha blok ICHIGA, PHP-FPM location'idan OLDIN qo'shing.
# 2. Konfiguratsiyani tekshiring:      sudo nginx -t
# 3. Xatolik bo'lmasa, qayta yuklang:  sudo systemctl reload nginx
# 4. Tekshirish: curl -I https://togogrouppro.uz/portfolio-all
#    Natija: "HTTP/1.1 301" va "Location: https://togogroup.uz/uz/portfolio"
#
# MUHIM: togogrouppro.uz domenini O'CHIRMANG — u shu redirectlar bilan
# doimiy ishlab turishi kerak, aks holda SEO qiymati yo'qoladi.
# ============================================================================

# --- Bosh sahifa ---
location = / {
    return 301 https://togogroup.uz/uz;
}

# --- Asosiy bo'limlar ---
location = /product-categories {
    return 301 https://togogroup.uz/uz/xizmatlar;
}

location = /portfolio-all {
    return 301 https://togogroup.uz/uz/portfolio;
}

location = /contact {
    return 301 https://togogroup.uz/uz/aloqa;
}

# --- Alohida mahsulot/xizmat sahifalari ---
# Jonli saytdan tasdiqlangan aniq yo'llar (kirillcha yo'llar URL-encoded):

location = /products/narujnaya-reklama {
    return 301 https://togogroup.uz/uz/xizmatlar;
}

location = /products/poligrafiya {
    return 301 https://togogroup.uz/uz/xizmatlar#uv-print;
}

location = /products/reklamnye-stendy {
    return 301 https://togogroup.uz/uz/xizmatlar#stend;
}

# "/products/Таблички" (Lightbox/vyveskalar)
location = /products/%D0%A2%D0%B0%D0%B1%D0%BB%D0%B8%D1%87%D0%BA%D0%B8 {
    return 301 https://togogroup.uz/uz/xizmatlar#lightbox;
}

# "/products/реклама на авто"
location = "/products/реклама на авто" {
    return 301 https://togogroup.uz/uz/xizmatlar#avto-reklama;
}

# "/products/Реклама на башенном кране"
location = "/products/Реклама на башенном кране" {
    return 301 https://togogroup.uz/uz/xizmatlar;
}

# --- Qolgan barcha /products/* yo'llar uchun umumiy zaxira ---
location /products/ {
    return 301 https://togogroup.uz/uz/xizmatlar;
}

# --- /login (admin panel edi, hozir kerak emas) ---
location = /login {
    return 301 https://togogroup.uz/uz;
}

# --- Qolgan barcha noma'lum yo'llar uchun umumiy zaxira ---
# E'TIBOR: bu qoidani PHP-FPM location'dan OLDIN joylashtiring, aks holda
# ishlamaydi (Laravel'ning o'z 404 sahifasi ko'rsatiladi).
location / {
    return 301 https://togogroup.uz/uz;
}
